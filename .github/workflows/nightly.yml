name: Nightly

# ARCHITECTURE.md §7.1: incremental collection per source -> full metric
# recompute -> regenerate dashboard -> deploy to Pages.
#
# The cron minute is deliberately off-the-hour (§7.1): GitHub's own docs warn
# that `schedule` can be delayed during periods of high load, and high-load
# times include the start of every hour.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# ARCHITECTURE.md §7.2: nightly/monthly-edition/backfill all write to the
# `data` branch, so they share one concurrency group. A queued run waits
# behind an in-progress one rather than cancelling it -- cancelling mid-write
# risks a half-committed Parquet partition.
concurrency:
  group: data-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Issue #172 (epic #168's multi-project nightly): Cassandra's own run
    # (first, unchanged) plus a loop over every other enabled
    # `projects/index.yaml` entry, each capped at 15m and continuing past a
    # failure, plus one multi-project site build -- a large first backfill
    # across several brand-new subprojects can legitimately use most of
    # this budget; 90 min keeps ample headroom under GitHub's 6-hour hard
    # job limit (ARCHITECTURE.md §7.2).
    timeout-minutes: 90
    outputs:
      pipeline-success: ${{ steps.pipeline.outcome == 'success' }}
      site-success: ${{ steps.site.outcome == 'success' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'

      # Installs exactly the versions pinned in uv.lock (--locked fails if the
      # lock is stale), then puts the project venv on PATH so later steps can
      # call `project-health` directly.
      - name: Install project-health
        working-directory: main
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Compute cache key (calendar week)
        id: cache-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # ARCHITECTURE.md §4.1: actions/cache is a build *accelerator* only,
      # never the durable store -- the real history lives on the `data`
      # branch. If this cache is missing (evicted, or a new week), the
      # collector's clone_or_fetch falls back to a blobless
      # `git clone --filter=blob:none --no-checkout`.
      - name: Cache apache/cassandra clone
        uses: actions/cache@v6
        with:
          path: work/apache-cassandra
          key: apache-cassandra-clone-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            apache-cassandra-clone-

      # Issue #172: every enabled subproject (`project-health list-projects`,
      # looped below) gets its own `../work/<id>` clone, but which ids are
      # enabled is only known at `list-projects` runtime, not at workflow
      # author time -- so a literal "one actions/cache step per repo,
      # keyed by id" isn't expressible here the way the single, known-ahead-
      # of-time apache/cassandra clone above is. One multi-path cache
      # covering the whole `work/` tree (minus apache-cassandra's own,
      # already-cached subdirectory) gets the same accelerator benefit for
      # however many subprojects are enabled on a given night, with no
      # per-id step to maintain as the registry grows.
      - name: Cache subproject clones
        uses: actions/cache@v6
        with:
          path: |
            work
            !work/apache-cassandra
          key: subproject-clones-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            subproject-clones-

      - name: Check whether the data branch exists
        id: data-branch
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ARCHITECTURE.md §4.2: the orphan `data` branch, checked out into
      # ./data, holding raw/, snapshots/, manifests/, state/.
      - name: Checkout data branch
        if: steps.data-branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - name: Create orphan data branch (first run)
        if: steps.data-branch.outputs.exists == 'false'
        run: |
          set -euo pipefail
          mkdir -p data
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p raw snapshots manifests state
          cat > README.md <<'EOF'
          # data

          Orphan branch holding cassandra-project-health's collected data
          (ARCHITECTURE.md §4.2). Not part of `main`'s history.

          ```
          raw/<source>/<table>/date=YYYY-MM-DD/part-*.parquet   # append-only, one partition per run
          snapshots/<run_id>/metrics.parquet                     # full computed-metric output for that run
          manifests/<run_id>.json                                 # run manifest (ARCHITECTURE.md §5)
          state/                                                  # per-source watermarks + last-good-run pointers
          ```

          Written by `.github/workflows/nightly.yml`. Do not edit by hand.
          EOF
          touch raw/.gitkeep snapshots/.gitkeep manifests/.gitkeep state/.gitkeep
          git add README.md raw/.gitkeep snapshots/.gitkeep manifests/.gitkeep state/.gitkeep
          git commit -q -m "chore: initialize orphan data branch"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q origin data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Issue #172: Cassandra's own run stays exactly as it was -- same
      # flags, same data dir -- except it no longer renders the site itself
      # (`--site-out` removed). The multi-project `project-health site` step
      # below renders Cassandra's page alongside every other enabled
      # project's, once, after every project's run has had its turn.
      - name: Run pipeline
        id: pipeline
        working-directory: main
        continue-on-error: true
        env:
          # ARCHITECTURE.md §7.4: prefer the higher-rate-limit classic PAT if
          # the repo owner has configured one; fall back to the built-in
          # token. Not consumed by any M0 collector yet (git + JIRA need no
          # GitHub auth) -- wired through now for the GitHub PR source (§2.1).
          PROJECT_HEALTH_GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # Collectors resolve GH_PAT, then GITHUB_TOKEN/GH_TOKEN (collectors/github.py,
          # collectors/github_checks.py). Actions does not export these automatically;
          # without them GitHub API calls run unauthenticated (60 req/hr).
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          project-health run \
            --project projects/cassandra.yaml \
            --data-dir ../data \
            --workdir ../work/apache-cassandra \
            --identity-overrides identity_overrides.yaml \
            --trigger "${{ github.event_name }}"

      # Issue #172: every other enabled `projects/index.yaml` entry gets its
      # own run, each writing under its own `projects/<id>/` data dir
      # (`data_layout.project_data_dir`) and its own `../work/<id>` clone.
      # No `GH_PAT` is configured for this repo (issue #172's own
      # description) -- the built-in `GITHUB_TOKEN`'s GraphQL budget is
      # shared across Cassandra's run above AND every subproject run here,
      # so each subproject run is capped at 15m and a failure or timeout
      # only warns and moves on to the next project (and still lets the
      # data-branch commit + site build below run) rather than failing the
      # whole nightly job -- a subproject that doesn't finish its backfill
      # tonight simply resumes from its own watermark tomorrow night.
      #
      # Before each subproject's own run: `seed-subproject` (idempotent,
      # see src/project_health/seed_subproject.py) copies that subproject's
      # GitHub PR/review/comment rows + cursor out of Cassandra's own
      # already-collected `raw/github` tables, if Cassandra's
      # `pull_requests.repos` happens to cover that subproject's repo --
      # sparing a newly-enabled subproject's first run from re-fetching PR
      # history on this same shared token budget. A no-op (same `::warning::`
      # + continue treatment) once a subproject has its own watermark, or
      # for a subproject whose repo Cassandra's config doesn't cover.
      - name: Run subproject pipelines
        id: subprojects
        working-directory: main
        env:
          PROJECT_HEALTH_GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          while IFS=$'\t' read -r project_id config_path; do
            [ -z "$project_id" ] && continue
            if [ "$project_id" = "cassandra" ]; then
              continue
            fi
            echo "::group::${project_id}"
            if ! project-health seed-subproject \
              --from ../data \
              --project "$config_path" \
              --data-dir "../data/projects/${project_id}"; then
              echo "::warning::seed-subproject failed for project '${project_id}'; continuing without seeding"
            fi
            if timeout 15m project-health run \
              --project "$config_path" \
              --data-dir "../data/projects/${project_id}" \
              --workdir "../work/${project_id}" \
              --identity-overrides identity_overrides.yaml \
              --trigger "${{ github.event_name }}"; then
              echo "project-health run succeeded for '${project_id}'"
            else
              echo "::warning::project-health run failed or timed out for project '${project_id}'; continuing with the rest of the nightly run"
            fi
            echo "::endgroup::"
          done < <(project-health list-projects --index projects/index.yaml)

      - name: Commit and push data branch
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git remote get-url origin > /dev/null 2>&1; then
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          # Issue #172: `projects/` (every subproject's own raw/snapshots/
          # manifests/state tree, data_layout.project_data_dir) joins the
          # existing four top-level dirs. `mkdir -p` first so `git add`
          # never fails over a directory that doesn't exist yet (e.g. the
          # very first night any subproject run produced no output at all).
          mkdir -p raw snapshots manifests state projects
          git add raw snapshots manifests state projects
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "data: nightly collection run ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin HEAD:data
          fi

      # Issue #172: renders every enabled `projects/index.yaml` entry that
      # has data -- Cassandra at the site root, every other project under
      # `p/<id>/` -- replacing the single-project `--site-out` Cassandra's
      # own run used to pass. Runs after the data-branch commit above (so a
      # site build failure never blocks that commit) but reads straight
      # from the local `../data` checkout, not the just-pushed remote.
      - name: Build multi-project site
        id: site
        working-directory: main
        continue-on-error: true
        run: |
          project-health site \
            --index projects/index.yaml \
            --data-dir ../data \
            --out ../site

      # ARCHITECTURE.md §7.3: deploy only if BOTH Cassandra's own pipeline
      # (metric computation) and the multi-project site build succeeded --
      # a failed run, or a site build that crashed partway through another
      # project, must never publish a half-built dashboard. The data branch
      # commit above still runs regardless, since raw partitions/watermarks
      # are valid even when metrics computation or site rendering fails.
      - name: Upload Pages artifact
        if: steps.pipeline.outcome == 'success' && steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pipeline-success == 'true' && needs.build.outputs.site-success == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
