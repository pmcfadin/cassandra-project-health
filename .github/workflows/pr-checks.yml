name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI
      # always installs exactly the committed dependency versions.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests with pytest
        run: uv run pytest -v
