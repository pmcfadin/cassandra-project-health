# Governance policy draft — Apache Cassandra per-commit minimums.
#
# STATUS: DRAFT. Per D14 (docs/spec/DECISIONS.md), the project owner must approve this policy before any
# compliance result computed from it is published on /governance/. Do not treat this file as authoritative
# until that approval is recorded (e.g. by removing this notice and bumping `version`).
#
# Full rationale, exact source quotes, and measured evidence hit rates for every rule and every
# `unknown`-only decision below are in docs/spec/GOVERNANCE.md — read that document before editing this file.
#
# Semantics (D14, D15):
#   - Each commit is judged against the policy version in force on its commit date (`effective_from`).
#     A policy change here is a dated version bump; it never silently rescores history.
#   - Every check reports pass / fail / unknown. `unknown` means evidence was unavailable — it is never
#     counted as fail, and any check whose measured false-negative rate is non-trivial is restricted to
#     pass/unknown only (`fail_allowed: false` below) so it structurally cannot produce a false fail.
#   - Every check result must carry the evidence it is based on (D15) so a reader can verify it.

version: 1
policy_name: cassandra-governance-draft
last_updated: "2026-09-25"
owner_approved: false

rules:
  - id: reviewer-present
    description: >
      A code change has at least one named reviewer, evidenced by a commit-trailer "reviewed by" clause
      or a populated JIRA reviewer custom field. Does NOT check reviewer count (2 committer +1s) or
      committer status — see docs/spec/GOVERNANCE.md §2 R1 and §4 for why those are out of scope.
    source_url: "https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance"
    source_quote: >
      "Code modifications must have been reviewed by at least one other contributor."
    effective_from: "2020-06-25"   # ratification date on the cwiki page
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
      excludes_change_types: [typo, docs, website, comment]  # "Commit Then Review" exemption, same source
    check_method:
      - evidence_source: git_commit_trailer
        detail: "src/project_health/collectors/reviewer_trailer.py; reviewers tuple non-empty"
        measured_hit_rate: "79-87% non-merge commits 2018+; 43-57% 2009-2013 (docs/spec/DATA-SOURCES.md §1)"
      - evidence_source: jira_reviewer_field
        detail: "customfield_12313420 (Reviewers) or customfield_10022 (Reviewer) populated"
        measured_hit_rate: "28/30 = 93% (30 most-recently-resolved CASSANDRA issues, sampled 2026-09-25)"
    result_semantics:
      pass: "named reviewer found by either evidence source"
      unknown: "no reviewer found by either source"
      fail_allowed: false
    not_scored:
      - "reviewer count (2 committer +1s, or 1 for test-only changes)"
      - "committer status of the named reviewer at time of review"
    per_commit_scope: "runs on every commit, including forward-merge commits with two parents (see GOVERNANCE.md §3) — never suppressed by a merge-commit filter"

  - id: jira-ticket-referenced
    description: >
      The commit message references a CASSANDRA-NNNNN issue key, per the documented commit-message format.
    source_url: "https://cassandra.apache.org/_/development/how_to_commit.html"
    source_quote: >
      "patch by <Authors,>; reviewed by <Reviewers,> for CASSANDRA-#####"
    effective_from: null   # convention predates any single dated ratification found; do not invent a date
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
      excludes_change_types: [typo, docs, website, comment]
    check_method:
      - evidence_source: git_commit_trailer
        detail: "issue_keys tuple non-empty (reviewer_trailer.py _ISSUE_KEY_RE)"
        measured_hit_rate: "not independently re-measured; co-occurs with reviewer-trailer rate (see reviewer-present)"
    result_semantics:
      pass: "issue key found in commit message"
      unknown: "no issue key found — cannot distinguish a missed requirement from a correctly exempt trivial change"
      fail_allowed: false

  - id: pre-commit-ci-evidence
    description: >
      Evidence that pre-commit CI was run and its results attached to the JIRA ticket before commit, for
      all affected branches.
    source_url: "https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance"
    source_quote: >
      "Code must not be committed before CI results have been provided for all affected branches."
    effective_from: "2020-06-25"
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    check_method:
      - evidence_source: jira_comment_ci_mention
        detail: >
          JIRA issue comments containing any of: ci_summary, results_details, circleci, ci-cassandra.apache.org,
          pre-ci.cassandra.apache.org, jenkins, butler, .build/run-ci
        measured_hit_rate: "12/30 = 40% (same 30-issue sample as reviewer-present, sampled 2026-09-25)"
      - evidence_source: github_check_runs
        detail: >
          GET /repos/apache/cassandra/commits/{sha}/check-runs — NOTE: this only surfaces the GitHub Actions
          licence/checkstyle workflow (see code-style-checkstyle rule below), NOT the pre-commit Jenkins
          pipeline this rule actually requires. Retained here as a documented limitation, not a substitute.
        measured_hit_rate: "20/29 = 69% (last 29 non-merge trunk commits, 2026-09-25) — wrong CI surface, see note"
      - evidence_source: ci_cassandra_jenkins_api
        detail: "ci-cassandra.apache.org post-commit Jenkins JSON API, per-SHA — named in issue #32, NOT live-tested this session"
        measured_hit_rate: null
        status: "UNVERIFIED — do not enable until tested live"
    result_semantics:
      pass: "JIRA-comment CI evidence found"
      unknown: "no JIRA-comment CI evidence found (60% of sample) — 40% hit rate means treating absence as fail would be wrong roughly 6 times in 10"
      fail_allowed: false

  - id: changes-txt-entry
    description: "User-impacting changes get a CHANGES.txt entry."
    source_url: "https://cassandra.apache.org/_/development/patches.html"
    source_quote: >
      "Include a CHANGES.txt entry (put it at the top of the list) ... only user-impacting items should be
      listed in CHANGES.txt."
    effective_from: null
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    check_method:
      - evidence_source: git_show_name_only
        detail: "exact path match on CHANGES.txt in the commit's changed-files list"
        measured_hit_rate: "21/29 = 72% (last 29 non-merge trunk commits, 2026-09-25)"
    result_semantics:
      pass: "CHANGES.txt touched"
      unknown: "CHANGES.txt not touched — rule is conditional on user-impact, which is not determined here"
      fail_allowed: false

  - id: news-txt-entry
    description: "Upgrade-relevant changes get a NEWS.txt entry."
    source_url: "https://cassandra.apache.org/_/development/how_to_review.html"
    source_quote: >
      "Have NEWS.txt, the cql3 docs, and the native protocol spec been updated if needed?"
    effective_from: null
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    check_method:
      - evidence_source: git_show_name_only
        detail: "exact path match on NEWS.txt in the commit's changed-files list"
        measured_hit_rate: "2/29 = 7% (last 29 non-merge trunk commits, 2026-09-25) — expected low, most changes are not upgrade-relevant"
    result_semantics:
      pass: "NEWS.txt touched"
      unknown: "NEWS.txt not touched — rule is explicitly conditional ('if needed')"
      fail_allowed: false

  - id: code-style-checkstyle
    description: "Checkstyle passes as part of the build, enforced via GitHub Actions on every push."
    source_url: "https://cassandra.apache.org/_/development/code_style.html"
    source_quote: >
      "Checkstyle is part of the build from Cassandra 4.1 included." "The checkstyle target is executed by
      default when e.g. build or jar targets are executed."
    effective_from: null  # version-anchored, not date-anchored — see applies_to
    applies_to:
      branches: ["cassandra-4.1", "cassandra-5.0", "cassandra-6.0", trunk]   # NOT cassandra-4.0 or earlier
      change_types: [code]
    check_method:
      - evidence_source: github_check_runs
        detail: "GET /repos/apache/cassandra/commits/{sha}/check-runs; corresponds to .github/workflows/code-check.yaml (ant-check-jdk11, ant-check-jdk17)"
        measured_hit_rate: "20/29 = 69% (last 29 non-merge trunk commits, 2026-09-25)"
    result_semantics:
      pass: "check-run exists and is green"
      fail: "check-run exists and is red — this is direct, unambiguous evidence, fail is allowed"
      unknown: "no check-run recorded at all (31% of sample) — patch-file-based (git am/apply) contributions never trigger GitHub Actions"
      fail_allowed: true

  - id: test-touched
    description: >
      OPTIONAL, INFORMATIONAL ONLY. NOT A DOCUMENTED CASSANDRA RULE. Cassandra's own docs state test extent
      is proportional to risk, not fixed (patches.html: "The extent to which tests are required depends on
      how likely your changes will effect the stability of Cassandra in production"). Shown for context only.
    source_url: null
    source_quote: null
    effective_from: null
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    check_method:
      - evidence_source: git_show_name_only
        detail: "path match on test/ within the commit's changed-files list"
        measured_hit_rate: "23/29 = 79% (last 29 non-merge trunk commits, 2026-09-25)"
    result_semantics:
      pass: null
      unknown: null
      fail_allowed: false
      display_only: true

# Rules explicitly NOT included as scoreable checks in this draft, with reasons.
# See docs/spec/GOVERNANCE.md §3 and §4 for full discussion.
not_scored:
  - rule: "two-committer-+1-vote count and committer status of reviewers"
    reason: "No confirmed public, dated, non-PMC committer roster exists to verify committer status at time of review (DATA-SOURCES.md §6)."
  - rule: "explicit veto / -1-blocking / 'active reasonable discussion' rules"
    reason: "Requires classifying comment content/sentiment; gated behind Phase 2a classifier validation (D1), not available in Phase 1's deterministic scope."
  - rule: "CI run result (pass/fail of the Jenkins run itself)"
    reason: "ci-cassandra.apache.org Jenkins JSON API named in issue #32 but not live-tested this session; only presence of CI evidence is scored, not its outcome."
  - rule: "merge-forward completeness (was a fix propagated to every branch it should reach)"
    reason: "Whether a bug affects a given branch is a product judgment no structural source can answer. Shown descriptively (which branches a JIRA key's commits were found on), never scored pass/fail."
  - rule: "universal 'tests required' minimum"
    reason: "Not a documented Cassandra rule — extent of testing is explicitly proportional to risk, not fixed. See test-touched for the optional, non-authoritative signal instead."
  - rule: "any ratified-governance-page rule (reviewer-present's vote count, pre-commit-ci-evidence) applied to commits before 2020-06-25"
    reason: "The source states its own ratification date (2020/06/25); D14 requires judging each commit against the policy in force on its commit date."

branches_in_scope:
  # Per docs/spec/GOVERNANCE.md §1 caution: patches.html's branch-policy table (4.0 "Code freeze", etc.) is
  # stale — downloads.apache.org still mirrors 4.0.21 (docs/spec/DATA-SOURCES.md §5). Use currently-mirrored
  # release lines instead, verified live 2026-09-25.
  active_release_branches: ["cassandra-3.0", "cassandra-3.11", "cassandra-4.0", "cassandra-4.1", "cassandra-5.0"]
  development_branches: ["cassandra-6.0", "trunk"]
  source: "https://downloads.apache.org/cassandra/ (directory listing), verified 2026-09-25"

merge_forward_policy:
  # See docs/spec/GOVERNANCE.md §3 for the full worked finding.
  per_commit_checks_run_on_merge_commits: true
  reason: >
    Live sampling of the last 5,000 merge commits on origin/cassandra-5.0 found 6 that carry a full
    "patch by X; reviewed by Y for CASSANDRA-NNNNN" trailer and a real code diff (the documented
    `git merge -s ours` + `git commit --amend` forward-merge workflow squashes the cherry-picked patch,
    trailer included, into a two-parent commit). A blanket --no-merges filter applied per-commit (rather
    than only for aggregate rate denominators, where it remains correct) would wrongly show "unknown" for a
    named commit that has real reviewer evidence.
  aggregate_rate_denominators_exclude_merges: true
  cross_branch_view: "descriptive only ('found on branches: X, Y, Z' via git log --all --grep=<issue-key>); never folded into a pass/fail verdict"
