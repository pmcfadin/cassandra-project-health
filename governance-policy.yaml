# Governance policy v2 — Apache Cassandra per-commit minimums.
#
# APPROVED v2. Owner approval recorded 2026-09-27 (DECISIONS.md D24). v1 (approved 2026-09-25) is
# superseded; see CHANGELOG.md for what changed and why. This file is authoritative for compliance
# results published on /governance/, subject to the exclusions and deferrals listed explicitly below.
#
# SOURCE RULE (D24): every scored rule and every exemption in this file encodes a rule published by the
# Apache Cassandra project itself -- never one this project invented. Each carries `source_url`, a
# verbatim `source_quote`, a `source_type`, and an `effective_from` taken from when the project
# published it. How evidence is found, and when missing evidence is `unknown` rather than `fail`, are
# measurement choices documented per rule; the rules themselves are the project's. `tests/` enforces
# that every scored rule and exemption has a source, and `project-health verify-policy-sources`
# re-fetches every source_url and confirms each quote still appears.
#
# Full rationale, exact source quotes, and measured evidence hit rates for every rule and every
# unknown/exempt/not_in_force decision below are in docs/spec/GOVERNANCE.md — read that document before
# editing this file.
#
# Semantics (D14, D15):
#   - Each commit is judged against the policy version in force on its commit date (`effective_from`).
#     A policy change here is a dated version bump; it never silently rescores history.
#   - Every check result must carry the evidence it is based on (D15) so a reader can verify it.
#   - Result states (see `result_states` below): pass, fail, unknown, exempt, not_in_force. `fail` is only
#     ever produced by a rule with `fail_allowed: true`, and only via the specific condition that rule states.

version: 2
policy_name: cassandra-governance-v2
approved_by: pmcfadin
approved_on: "2026-09-27"
last_updated: "2026-09-27"
supersedes: {version: 1, approved_on: "2026-09-25"}

# Where a rule or exemption may come from (D24). Nothing else qualifies.
source_types:
  ratified_governance: >
    The PMC-ratified "Cassandra Project Governance" page on cwiki.apache.org (ratified 2020-06-25).
  official_docs: >
    The project's official contributor documentation on cassandra.apache.org/_/development/, maintained
    by the PMC through reviewed patches to apache/cassandra-website. Not voted, but the project's
    published instructions to contributors.
  official_tooling: >
    Scripts in an apache/* repository that the official docs instruct contributors or release managers
    to run (e.g. cassandra-builds/cassandra-release/prepare_release.sh); cited only for the exact commits
    those scripts create.

# History (D14): v2 rescores all history. Each rule and exemption applies from its own effective_from,
# so no commit is judged against a rule the project had not yet published. v1 -> v2 differences are
# recorded in CHANGELOG.md with counts.
rescore_history: true

# Global result states. Every check on every commit resolves to exactly one of these.
result_states:
  pass: "Evidence positively confirms the rule was met."
  fail: >
    Evidence positively contradicts the rule. Only reachable on a rule with fail_allowed: true, and only
    through that rule's stated fail condition — never merely "no evidence found."
  unknown: >
    The rule is in force for this commit's date and no exemption applies, but no evidence was found either
    way, or the evidence source has a large enough false-negative rate that absence cannot be read as
    non-compliance (D15).
  exempt: >
    The commit matches a documented, testable exemption pattern for this rule (e.g. ninja,
    release-housekeeping). The rule does not apply to it, regardless of what evidence is or isn't present.
  not_in_force: >
    The commit's date is before the rule's effective_from. Distinct from unknown: this is not a
    missing-evidence gap, it is the factual statement that the rule did not exist yet on that date, per D14
    ("each commit is judged against the policy in force on its commit date"). A rule with no dated source
    (effective_from: null) is always in force and never produces this state.

# MEASUREMENT (ours): a commit is a docs-only change when every changed path matches one of these.
# Used by the commit-then-review and not-code exemptions to implement the official rules above.
docs_only_paths:
  - "doc/**"
  - "**/*.md"
  - "**/*.adoc"
  - "**/*.rst"
  - "CHANGES.txt"
  - "NEWS.txt"
  - "**/README*"
  - "**/LICENSE*"
  - "**/NOTICE*"

rules:
  - id: reviewer-present
    description: >
      A code change has at least one named reviewer, evidenced by a commit-trailer "reviewed by" clause or
      a populated JIRA reviewer custom field. FAILS only when the commit references a CASSANDRA-N issue key
      (i.e. looks like a normal reviewable code change) and no reviewer is found by either evidence source
      and no exemption matches. Does NOT check reviewer count (two committer +1s) or committer status —
      see `deferred_to_v2` below.
    source_type: ratified_governance
    source_url: "https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance"
    source_quote: >
      "Code modifications must have been reviewed by at least one other contributor."
    effective_from: "2020-06-25"   # ratification date on the cwiki page
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    exemptions:
      - id: commit-then-review
        description: >
          Typo, documentation, website and comment corrections operate under Commit Then Review, so a
          reviewer is not required before commit.
        source_type: ratified_governance
        source_url: "https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance"
        source_quote: >
          "Correcting typos, docs, website, and comments etc operate a “Commit Then Review” policy"
        effective_from: "2020-06-25"
        detection: docs_only_change
        detection_note: >
          MEASUREMENT (ours): applied when every path the commit changes matches `docs_only_paths`
          (top-level key). Typo or comment fixes inside source files cannot be told apart from code
          changes by path, so they are NOT exempted here; they are scored normally, and the corrections
          process (governance_overrides.yaml) handles any that are mis-scored.
        result: exempt
      - id: release-process
        description: >
          Commits the official release process instructs the release manager to make directly.
        result: exempt
        sub_patterns:
          - id: version-increment
            source_type: official_docs
            source_url: "https://cassandra.apache.org/_/development/release_process.html"
            source_quote: >
              git commit -m "Increment version to <next-version>" build.xml debian/changelog CHANGES.txt
            effective_from: null
            pattern: '(?im)^(increment|bump)\b.*\bversion\b'
            pattern_scope: first_line
            example: "Increment version to 5.0.10"
          - id: debian-changelog
            source_type: official_tooling
            source_url: "https://github.com/apache/cassandra-builds/blob/trunk/cassandra-release/prepare_release.sh"
            source_quote: >
              echo "Prepare debian changelog for $release" > "_tmp_msg_"
            source_context: >
              release_process.html instructs the release manager to run prepare_release.sh, which makes
              this commit.
            effective_from: null
            pattern: '(?im)^prepare\s+debian\s+changelog\b'
            pattern_scope: first_line
            example: "Prepare debian changelog for 3.11.19"
    removed_in_v2:
      - id: ninja
        reason: >
          No official source. v1 exempted self-declared ninja commits "by long-standing project
          convention (observed throughout trunk history)" -- a convention we observed, not a rule the
          project published. v2 scores these commits like any other; ninja fixes that only touch docs are
          covered by commit-then-review.
      - id: submodule-repin
        reason: "No official source found in the governance page, contributor docs or release process."
    check_method:
      - evidence_source: git_commit_trailer
        detail: "src/project_health/collectors/reviewer_trailer.py; reviewers tuple non-empty"
        measured_hit_rate: "79-87% non-merge commits 2018+; 43-57% 2009-2013 (docs/spec/DATA-SOURCES.md §1)"
      - evidence_source: jira_reviewer_field
        detail: "customfield_12313420 (Reviewers) or customfield_10022 (Reviewer) populated"
        measured_hit_rate: "28/30 = 93% (30 most-recently-resolved CASSANDRA issues, sampled 2026-09-25)"
    review_wording_check:
      # Guard against false fails when the trailer parser misses a real reviewer mention because of an
      # unsupported phrasing. Applied AFTER the exemptions and BEFORE fail is
      # ever produced.
      pattern: '(?i)\breview(ed|er|ers)?\b'
      pattern_scope: full_commit_message
      purpose: >
        If this pattern matches the commit message but neither evidence source (trailer, JIRA field)
        produced a reviewer, the result is `unknown` with evidence "review text present but unparsed" —
        never `fail`. A commit that names a real reviewer in a form the parser doesn't yet handle must not
        be shown as an unreviewed FAIL with the author's and reviewer's names attached (D15).
      regression_examples:
        - sha: 208d87513f658f6fbf82cabcbb04142e7319fa55
          message: "patch by Mick Semb Wever; reviewed Štefan Miklošovič for CASSANDRA-21489"
          issue: 'reviewer named without the word "by" ("reviewed <Name>") — reviewer_trailer.py requires the literal "reviewed by"'
        - sha: 05186d786974f3caf0491d5373b648c97c718c4a
          message: "Authored by Lorina Poland (polandll); Reviewed by Branimir Lambov (blambov) for CASSANDRA-18236"
          issue: '"Authored by ...; Reviewed by ..." form — the line does not start with "patch by" or "reviewed by", so the anchored trailer regex never matches even though "Reviewed by" is literally present'
      parser_extension_needed: >
        Issue #36 should extend reviewer_trailer.py to parse the "reviewed <Name>" (missing "by") and
        "Authored by <Name>; Reviewed by <Name>" forms, so these become real `pass` results instead of
        `unknown` in a future version.
    measured_on_trunk_since_2023:
      # Orchestrator's measurement (2026-09-25) that the owner approved fail_allowed:true against, then
      # corrected after applying the v1 patterns live and finding the two regression examples above:
      # trunk, non-merge commits, since 2023-01-01.
      total_commits: 2151
      trailer_reviewer: 1773
      jira_field_only_reviewer: 85
      no_reviewer_evidence: 293
      no_reviewer_breakdown:
        ninja_exempt: 72
        release_housekeeping_exempt: 209   # "most of the rest" per orchestrator; residual after ninja, the unparsed-review-text cases, and the 10 fails below
        review_text_present_but_unparsed: 2   # the two regression examples above — unknown, never fail
        jira_keyed_no_reviewer_fail: 10   # corrected from an initial 12 after excluding the 2 unparsed-review-text cases
      independent_spot_check: >
        Not independently re-derived commit-by-commit (no JIRA-field cross-reference performed in this
        pass). A rough text-only spot-check of the same population found 114 ninja-token matches and 116
        release-housekeeping-pattern matches, leaving ~47 residual no-trailer/has-issue-key commits before
        any JIRA-reviewer-field cross-reference and the review-wording-check narrow that toward the
        orchestrator's corrected 10 — consistent in order of magnitude. See docs/spec/GOVERNANCE.md §8.
    descriptive_signal:
      - id: ninja-count-trend
        description: >
          Count of commits whose message self-declares "ninja", per month/quarter, displayed next to this
          rule (not scored). Descriptive only: since v2 "ninja" is NOT an exemption (no official source),
          so these commits are scored normally.
        scored: false
    result_semantics:
      pass: "named reviewer found by either evidence source"
      fail: "CASSANDRA-N key referenced AND no reviewer found by either evidence source AND no exemption matched AND review_wording_check does NOT match (no review wording anywhere in the message)"
      unknown: >
        Either (a) no CASSANDRA-N key referenced and no reviewer found, or (b) review_wording_check matches
        (the message contains "review"/"reviewed"/"reviewer"/"reviewers" in some form) but no reviewer was
        extracted by either evidence source — evidence recorded as "review text present but unparsed", see
        regression_examples above. Never fail in case (b).
      exempt: "commit-then-review (docs-only change) or release-process commit — never fail regardless of reviewer evidence"
      not_in_force: "commit date is before 2020-06-25"
      fail_allowed: true
    not_scored:
      - "reviewer count (2 committer +1s, or 1 for test-only changes) — see deferred_to_v2"
      - "committer status of the named reviewer at time of review — see deferred_to_v2"
    per_commit_scope: >
      Runs on every commit, including forward-merge commits with two parents (see GOVERNANCE.md §3) — never
      suppressed by a merge-commit filter.

  - id: jira-ticket-referenced
    description: >
      The commit message references a CASSANDRA-NNNNN issue key, per the documented commit-message format.
      No fail state: an absent issue key is either a documented exemption or unknown, never a fail.
    source_type: official_docs
    source_url: "https://cassandra.apache.org/_/development/how_to_commit.html"
    source_quote: >
      "patch by <Authors,>; reviewed by <Reviewers,> for CASSANDRA-#####"
    effective_from: null   # convention predates any single dated ratification found; do not invent a date
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    exemptions:
      - id: release-process
        description: "Same sourced release-process commits as reviewer-present (version increment, debian changelog)."
        result: exempt
        same_as: reviewer-present.exemptions.release-process
    removed_in_v2:
      - {id: ninja, reason: "No official source (see reviewer-present.removed_in_v2)."}
      - {id: submodule-repin, reason: "No official source."}
    check_method:
      - evidence_source: git_commit_trailer
        detail: "issue_keys tuple non-empty (reviewer_trailer.py _ISSUE_KEY_RE)"
        measured_hit_rate: "not independently re-measured; co-occurs with reviewer-trailer rate (see reviewer-present)"
    result_semantics:
      pass: "issue key found in commit message"
      exempt: "release-process commit"
      unknown: "no issue key found and no exemption matched"
      fail_allowed: false

  - id: pre-commit-ci-evidence
    name: "CI results provided before commit"
    description: >
      CI results were provided on the JIRA ticket before the commit. pass/unknown only: CI results may
      legitimately be provided somewhere this check cannot see, so their absence is never read as a fail.
    source_type: ratified_governance
    source_url: "https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance"
    source_quote: >
      "Code must not be committed before CI results have been provided for all affected branches."
    effective_from: "2020-06-25"
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]   # docs-only changes (docs_only_paths) are not code -> exempt: not-code
    exemptions:
      - id: not-code
        description: "The governance sentence covers code; a docs-only change is not code."
        source_type: ratified_governance
        source_url: "https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance"
        source_quote: >
          "Code must not be committed before CI results have been provided for all affected branches."
        effective_from: "2020-06-25"
        detection: docs_only_change
        result: exempt
      - id: release-process
        same_as: reviewer-present.exemptions.release-process
        result: exempt
    check_method:
      # MEASUREMENT (ours). Evidence must be dated at or before the commit timestamp, per "before".
      - evidence_source: jira_attachment_ci_artefact
        detail: >
          A JIRA attachment on any referenced issue whose filename matches (?i)^ci_summary|^results_details,
          created at or before the commit. These are the artefacts .build/run-ci produces
          (cassandra.apache.org/_/development/ci.html).
      - evidence_source: jira_comment_ci_mention
        detail: >
          A JIRA comment on any referenced issue, created at or before the commit, containing any of:
          ci_summary, results_details, circleci, ci-cassandra.apache.org, pre-ci.cassandra.apache.org,
          ci-cassandra.infra.datastax.com, astro-cass.ci, jenkins, butler, .build/run-ci
        term_list_note: >
          Hosts are CI systems the docs accept: "pre-ci.cassandra.apache.org, or any clone of it" including
          "A clone operated by your employer" (ci.html). New hosts are added by PR with an example ticket.
    v1_measured_hit_rate: "12/30 = 40% comments only (2026-09-25)"
    v2_measured_hit_rate: "TO BE MEASURED before publishing (issue for policy v2 implementation)"
    result_semantics:
      pass: "attachment or comment evidence found, dated at or before the commit"
      unknown: >
        (a) no evidence found; (b) evidence found only AFTER the commit (evidence text says so); or
        (c) no issue key referenced, so there is no ticket to check.
      exempt: "not-code (docs-only change) or release-process commit"
      not_in_force: "commit date is before 2020-06-25"
      fail_allowed: false
    not_scored:
      - "whether CI covered ALL affected branches (artefact filenames encode fork/branch but not reliably the target branch) -- descriptive only"
      - "CI outcome (pass/fail of the run) -- see not_scored at the end of this file"

  - id: ci-artefacts-attached
    name: "CI artefacts attached to the JIRA ticket before commit"
    description: >
      Both pre-commit CI artefacts (ci_summary and results_details) are attached to the JIRA ticket before
      the commit, as the official contributor docs require of every patch since 2026-08-19.
    source_type: official_docs
    source_url: "https://cassandra.apache.org/_/development/patches.html"
    source_quote: >
      "Run the patch through pre-commit CI, with .build/run-ci, and attach the ci_summary and
      results_details artefacts to the ticket. This is expected of every patch before it is committed."
    additional_sources:
      - url: "https://cassandra.apache.org/_/development/ci.html"
        quote: "Attach both to the Jira ticket. They are the record that the patch was tested, they outlive any CI instance"
    effective_from: "2026-08-19"
    effective_from_evidence: >
      Instruction added to the official docs by apache/cassandra-website commit 30bdcc1 (2026-08-19,
      "Update testing and CI documentation", CASSANDRA-21586), following the 2025-08-27 dev@ announcement
      of pre-ci.cassandra.apache.org (lists.apache.org/thread/8pjk481f59rtj18v8d95bojxwmzp9jdr).
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    exemptions:
      - id: not-code
        same_as: pre-commit-ci-evidence.exemptions.not-code
        result: exempt
      - id: release-process
        same_as: reviewer-present.exemptions.release-process
        result: exempt
    check_method:
      - evidence_source: jira_attachment_ci_artefact
        detail: >
          On any referenced issue: at least one attachment matching (?i)^ci_summary AND at least one matching
          (?i)^results_details, each created at or before the commit. The attachment list of an issue is
          complete (it is JIRA's own record), which is what makes a fail state honest here.
    result_semantics:
      pass: "both artefacts attached at or before the commit"
      fail: >
        Issue key referenced, the issue's attachment list was fetched, and it lacks one or both artefacts
        dated at or before the commit. Evidence names what is missing and whether it was attached later.
      unknown: "no issue key referenced, or the issue's attachments have not been fetched yet (backfill budget)"
      exempt: "not-code (docs-only change) or release-process commit"
      not_in_force: "commit date is before 2026-08-19"
      fail_allowed: true

  - id: changes-txt-entry
    description: >
      User-impacting changes get a CHANGES.txt entry. v1: displayed as a fact on the commit row, not
      evaluated as a rule (scored: false) — the condition ("user-impacting") cannot be determined
      algorithmically, so no pass/fail/unknown verdict is produced.
    source_type: official_docs
    source_url: "https://cassandra.apache.org/_/development/patches.html"
    source_quote: >
      "Include a CHANGES.txt entry (put it at the top of the list)" ... "Please note that only
      user-impacting items should be listed in CHANGES.txt."
    effective_from: null
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    check_method:
      - evidence_source: git_show_name_only
        detail: "exact path match on CHANGES.txt in the commit's changed-files list"
        measured_hit_rate: "21/29 = 72% (last 29 non-merge trunk commits, 2026-09-25)"
    scored: false
    result_semantics:
      display_only: true

  - id: news-txt-entry
    description: >
      Upgrade-relevant changes get a NEWS.txt entry. v1: displayed as a fact on the commit row, not
      evaluated as a rule (scored: false).
    source_type: official_docs
    source_url: "https://cassandra.apache.org/_/development/how_to_review.html"
    source_quote: >
      "Have NEWS.txt, the cql3 docs, and the native protocol spec been updated if needed?"
    effective_from: null
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    check_method:
      - evidence_source: git_show_name_only
        detail: "exact path match on NEWS.txt in the commit's changed-files list"
        measured_hit_rate: "2/29 = 7% (last 29 non-merge trunk commits, 2026-09-25) — expected low, most changes are not upgrade-relevant"
    scored: false
    result_semantics:
      display_only: true

  - id: code-style-checkstyle
    description: "Checkstyle passes as part of the build, enforced via GitHub Actions on every push. Approved as drafted for v1."
    source_type: official_docs
    source_url: "https://cassandra.apache.org/_/development/code_style.html"
    source_quote: >
      "Checkstyle is part of the build from Cassandra 4.1 included." "The checkstyle target is executed by
      default when e.g. build or jar targets are executed."
    effective_from: null  # version-anchored, not date-anchored — see applies_to
    applies_to:
      branches: ["cassandra-4.1", "cassandra-5.0", "cassandra-6.0", trunk]   # NOT cassandra-4.0 or earlier
      change_types: [code]
    check_method:
      - evidence_source: github_check_runs
        detail: "GET /repos/apache/cassandra/commits/{sha}/check-runs; corresponds to .github/workflows/code-check.yaml (ant-check-jdk11, ant-check-jdk17)"
        measured_hit_rate: "20/29 = 69% (last 29 non-merge trunk commits, 2026-09-25)"
    result_semantics:
      pass: "check-run exists and is green"
      fail: "check-run exists and is red — this is direct, unambiguous evidence, fail is allowed"
      unknown: "no check-run recorded at all (31% of sample) — patch-file-based (git am/apply) contributions never trigger GitHub Actions"
      fail_allowed: true

  - id: test-touched
    description: >
      OPTIONAL, INFORMATIONAL ONLY. NOT A DOCUMENTED CASSANDRA RULE. Cassandra's own docs state test extent
      is proportional to risk, not fixed (patches.html: "The extent to which tests are required depends on
      how likely your changes will effect the stability of Cassandra in production"). v1: displayed as a
      fact on the commit row (scored: false), never a rule.
    source_url: null
    source_quote: null
    effective_from: null
    applies_to:
      branches: [trunk, "cassandra-*"]
      change_types: [code]
    check_method:
      - evidence_source: git_show_name_only
        detail: "path match on test/ within the commit's changed-files list"
        measured_hit_rate: "23/29 = 79% (last 29 non-merge trunk commits, 2026-09-25)"
    scored: false
    result_semantics:
      display_only: true

# Rules explicitly out of scope for v1 and v2 both, with reasons. Distinct from `deferred_to_v2` below,
# which lists rules the owner wants revisited once a specific data gap closes.
# See docs/spec/GOVERNANCE.md §3 and §4 for full discussion.
not_scored:
  - rule: "explicit veto / -1-blocking / 'active reasonable discussion' rules"
    reason: "Requires classifying comment content/sentiment; gated behind Phase 2a classifier validation (D1), not available in Phase 1's deterministic scope."
  - rule: "CI run result (pass/fail of the Jenkins run itself)"
    reason: "ci-cassandra.apache.org Jenkins JSON API not yet live-tested (issue #36); only presence of CI evidence is scored, not its outcome. See pre-commit-ci-evidence.v2_upgrade_condition."
  - rule: "merge-forward completeness (was a fix propagated to every branch it should reach)"
    reason: "Whether a bug affects a given branch is a product judgment no structural source can answer. Shown descriptively (which branches a JIRA key's commits were found on), never scored pass/fail."
  - rule: "universal 'tests required' minimum"
    reason: "Not a documented Cassandra rule — extent of testing is explicitly proportional to risk, not fixed. See test-touched for the display-only, non-authoritative signal instead."

# Rules the owner wants revisited once the specific listed data gap closes. Not scored (v1 or v2).
deferred_to_v2:
  - id: reviewer-is-committer
    description: "Verify the named reviewer held committer status at the time of review."
    reason: >
      Needs a public, dated committer (not just PMC) roster with join dates, which is not confirmed
      available (docs/spec/DATA-SOURCES.md §6 — Whimsy's committee-info.json is PMC-only;
      reporter.apache.org is 401/ASF-committer-gated). Revisit if a future research task locates one.
  - id: two-committer-plus-one-votes
    description: >
      Verify two +1 committer votes (or one, if the author is themself a committer) per the ratified
      governance rule, rather than the v1 proxy of "a reviewer is named."
    reason: "Same committer-join-date gap as reviewer-is-committer; also requires knowing the author's committer status and counting distinct binding +1s rather than a single named-reviewer string."

branches_in_scope:
  # Per docs/spec/GOVERNANCE.md §1 caution: patches.html's branch-policy table (4.0 "Code freeze", etc.) is
  # stale — downloads.apache.org still mirrors 4.0.21 (docs/spec/DATA-SOURCES.md §5). Use currently-mirrored
  # release lines instead, verified live 2026-09-25.
  active_release_branches: ["cassandra-3.0", "cassandra-3.11", "cassandra-4.0", "cassandra-4.1", "cassandra-5.0"]
  development_branches: ["cassandra-6.0", "trunk"]
  source: "https://downloads.apache.org/cassandra/ (directory listing), verified 2026-09-25"

merge_forward_policy:
  # See docs/spec/GOVERNANCE.md §3 for the full worked finding.
  per_commit_checks_run_on_merge_commits: true
  reason: >
    Live sampling of the last 5,000 merge commits on origin/cassandra-5.0 found 6 that carry a full
    "patch by X; reviewed by Y for CASSANDRA-NNNNN" trailer and a real code diff (the documented
    `git merge -s ours` + `git commit --amend` forward-merge workflow squashes the cherry-picked patch,
    trailer included, into a two-parent commit). A blanket --no-merges filter applied per-commit (rather
    than only for aggregate rate denominators, where it remains correct) would wrongly show "unknown" for a
    named commit that has real reviewer evidence.
  aggregate_rate_denominators_exclude_merges: true
  cross_branch_view: "descriptive only ('found on branches: X, Y, Z' via git log --all --grep=<issue-key>); never folded into a pass/fail verdict"
