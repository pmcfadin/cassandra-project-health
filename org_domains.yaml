# --- Owner-to-review ---------------------------------------------------
#
# Seen in the same top-50-domain pull but NOT added above -- ambiguous
# enough (personal-looking domain, unclear/uncertain current entity, or an
# academic institution rather than a corporate employer) that this review
# left them out rather than guess. Counts are commits/3y from the same
# `git log` pull as above.
#
#   aber.io (10), ultrablake.com (24)   -- domain doesn't resolve to a
#     publicly identifiable company; may be personal.
#   computer.org (1)                    -- IEEE Computer Society: a
#     membership organization, not an employer in the sense this map is
#     for; ambiguous fit.
#   richrelevance.com (1)               -- RichRelevance was acquired by
#     Manthan in 2020; current entity/domain status uncertain from a single
#     data point.
#   gatech.edu, snu.ac.kr, iith.ac.in, nitsri.ac.in (1 each) -- academic
#     institutions, not corporate employers; whether a university counts as
#     an "organization" for corporate-capture-risk purposes (elephant_factor's
#     whole point) is itself a judgment call this review didn't want to make
#     unilaterally.
#   est.tech, stsoft.ru (1 each)        -- could not identify with
#     confidence.
