# PMC-wide shared config (issue #169, epic #168).
#
# Sections here are the same across every Apache Cassandra PMC project, not
# specific to the main `apache/cassandra` repo -- the ASF dev@/user@
# mailing lists, the PMC/committer roster, bot-identity/automated-sender
# patterns, the curated affiliation files, and the ASF JIRA instance's
# global custom-field IDs (`reviewer_extraction.jira_fields`) are all one
# PMC-wide fact, not a per-repo one. A project's own `projects/<id>.yaml`
# pulls this in with `extends: _shared.yaml` (`load_project`'s deep merge,
# `config.py::_deep_merge` -- the project's own file always wins on a key
# both define) rather than repeating it.
#
# Moved verbatim out of `projects/cassandra.yaml` (issue #169) -- values are
# unchanged; see that file's git history before this change for the
# per-field provenance comments that used to live inline here (dev@/user@
# automated-sender list verified against a live pull 2009-01-28 through
# 2026-09-25, bot_patterns precaution for copilot-pull-request-reviewer
# added per PR #147 review, etc.) -- this split is a pure reorg, no values
# changed (tests/test_config.py's before/after equality test enforces
# Cassandra's own resolved config is byte-identical to before this file
# existed).

mailing_lists:
  type: ponymail                   # selects collectors/ponymail.py
  domain: cassandra.apache.org
  lists: [dev, user]               # not commits@ -- auto-generated commit-notification traffic, not discussion (issue #33)
  metadata_only: true              # Phase 1 (D1): sender, timestamp, thread structure -- no body
  max_months_per_run: 36           # nightly time budget (issue #33 fixup): ~5 min/list at the <=2 req/s pacing
                                    # cap; backfills oldest-first across runs until each list is caught up
  automated_senders:
    - '(?i)^jenkins@builds\.apache\.org$'
    - '(?i)^hudson@hudson\.apache\.org$'
    - '(?i)^hudson@hudson\.zones\.apache\.org$'
    - '(?i)^git@git\.apache\.org$'
    - '(?i)^no-reply@apache\.org$'

roster:
  type: asf_whimsy                 # selects core/adapters/asf_roster.py
  committee_info_url: https://whimsy.apache.org/public/committee-info.json
  public_ldap_projects_url: https://whimsy.apache.org/public/public_ldap_projects.json
  podling: false

affiliations_file: affiliations.yaml   # D6: curated, PR-reviewed, dated ranges
org_domains_file: org_domains.yaml     # D6: reviewed email-domain -> organization map (issue #52)
org_aliases_file: org_aliases.yaml     # D6: reviewed GitHub company-field alias map (issue #52 fixup 1)
github_company_lookback_months: 24     # D6, issue #52 fixup cycle 2

# Applied by identity resolution before any metric counts a contributor.
bot_patterns:
  - field: git_author_email
    regex: '(?i)noreply@github\.com$|\[bot\]'
  - field: github_login
    regex: '(?i)-bot$|^dependabot'
  - field: github_login
    regex: '(?i)^copilot-pull-request-reviewer(\[bot\])?$'
  - field: jira_username
    regex: '(?i)^svn-role$|^git-role$'   # ASF infra service accounts

# Phase 2a text pipeline (issue #43, D18): automated senders whose messages
# are dropped before fetch/preprocess. Distinct from `bot_patterns` above
# (identity exclusion vs. per-message sender exclusion) -- see
# `config.AutomatedSenderPattern`'s docstring.
automated_senders:
  - regex: '(?i)^jira@|@jira\.apache\.org$'
    note: "ASF JIRA's own notification/integration address"
  - regex: '(?i)^git@|^commits?@'
    note: "commit-notification mail, not discussion (issue #33 excludes commits@ from mailing_lists.lists for the same reason)"
  - regex: '(?i)noreply@github\.com$|^notifications@github\.com$'
    note: "GitHub notification mail"
  - regex: '(?i)\[bot\]|-bot$|^dependabot'
    note: "GitHub App / dependabot-style bot accounts, mirrors bot_patterns.github_login"
  - regex: '(?i)^hudson@|^jenkins@|^ci@|^builds?@'
    note: "CI system notification senders"
  - regex: '(?i)^svn-role$|^git-role$'
    note: "ASF infra service accounts (JIRA username form), mirrors bot_patterns.jira_username"

# ASF JIRA's own custom-field IDs for the "Reviewers"/"Reviewer" fields are
# global to the whole JIRA instance (issues.apache.org/jira), not scoped to
# the CASSANDRA project -- shared across every ASF Cassandra PMC subproject
# that files issues in the same JIRA instance. A project's own
# `reviewer_extraction.commit_trailer` (its commit-message convention) is
# NOT shared -- it stays in that project's own YAML, deep-merged alongside
# this inherited `jira_fields`.
reviewer_extraction:
  jira_fields:
    type: jira_custom_field
    reviewers_field: customfield_12313420   # "Reviewers", multi-user (11,125 CASSANDRA issues populated)
    reviewer_field: customfield_10022        # "Reviewer", single-user, older/legacy (7,104 issues populated)
