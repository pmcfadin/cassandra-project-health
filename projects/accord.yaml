# Apache Cassandra Accord — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Accord has no JIRA project of its own; its issues are filed in CASSANDRA
# with `component = Accord`, hence `issue_tracker.jql_filter` below rather
# than a distinct `project_key`.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-accord,
# .../tags?per_page=30): default_branch=trunk, NO tags at all -- no GA
# release tags, ever. No `releases:` section below (issue #181): with no
# systematic release-tag scheme to point `git_tags_cross_checked_archive`
# at, release cadence is not a thing this project has, not a thing it has
# zero data for -- omitting the section makes `pipeline.applicable_sources`
# treat `release` as not_applicable (metrics_not_applicable), rather than
# collecting a real-but-always-empty `release` table that degrades the run
# every time (release_frequency/release_regularity/time_since_last_release/
# days_between_releases all emit zero rows with zero GA dates -- see
# `metrics/release_cadence.py`).
# `has_issues: false` -- no github_issues section.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: accord
  display_name: Apache Cassandra Accord

repos:
  - owner: apache
    name: cassandra-accord
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSANDRA
  jql_filter: 'component = Accord'

pull_requests:
  type: github
  repos: [apache/cassandra-accord]

# No `releases:` section -- see the module-top comment (issue #181): accord
# has no GA release tags at all, so release cadence is not_applicable here,
# not a degraded/missing metric. (Also verified live 2026-10-12:
# https://archive.apache.org/dist/cassandra/cassandra-accord/ and
# https://archive.apache.org/dist/cassandra/accord/ both 404 -- no
# archive.apache.org/dist distribution either.)

# `releases_tab:` (issue #175): CASSANDRA fixVersions scoped by this
# project's own `issue_tracker.jql_filter` (`component = Accord`) above --
# same AND-clause discipline issue #181 already requires of `collectors/
# release_lines.py`'s fixVersion search -- plus GitHub Actions CI.
# Live-verified 2026-10-12: apache/cassandra-accord's default branch
# (`trunk`) has ZERO GitHub Actions workflows at all (`gh api repos/apache/
# cassandra-accord/actions/workflows` returns `total_count: 0`) -- the site
# renders "not tracked" for CI, a verified fact, not a guess.
releases_tab:
  type: jira_versions_github_actions

shared_sources: [asf_roster, ponymail, governance]
