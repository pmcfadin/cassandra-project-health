# Cassandra project configuration — placeholder
# Schema defined in docs/spec/ARCHITECTURE.md §2.1. Values below follow that schema's shape;
# treat this file as a starting point to review before the collectors are built, not final config.
#
# Issue #169 (fixup round 1): PMC-wide sections moved to two shared bases,
# both inherited here via `extends:` (a list -- deep-merged in order, then
# this file's own sections, which always win on a shared key):
#   - projects/_identity.yaml: bot_patterns, affiliations/org files,
#     github_company_lookback_months -- every project extends this one.
#   - projects/_shared.yaml: mailing_lists, roster,
#     reviewer_extraction.jira_fields, automated_senders -- only verified
#     for apache/cassandra today, so only this file extends it.
# This is a pure reorg: `load_project("projects/cassandra.yaml")`'s
# resolved `ProjectConfig` is unchanged (tests/test_config.py enforces it).
extends: [_identity.yaml, _shared.yaml]

project:
  id: cassandra
  display_name: Apache Cassandra
  homepage: https://cassandra.apache.org

# One or more repos; the git adapter clones/fetches each. cassandra-website is illustrative —
# confirm whether it should be in scope before enabling it.
repos:
  - owner: apache
    name: cassandra
    default_branch: trunk
  # - owner: apache
  #   name: cassandra-website
  #   default_branch: main

issue_tracker:
  type: jira                       # selects core/adapters/jira.py
  base_url: https://issues.apache.org/jira
  project_key: CASSANDRA

pull_requests:
  type: github                     # selects core/adapters/github.py; GitHub PRs cover only
  # part of review activity per DECISIONS.md — JIRA is primary for Cassandra.
  # Related repos confirmed to exist (DATA-SOURCES.md §3, verified 2026-09-25); all have
  # GitHub Issues/Discussions disabled like the main repo, so PRs are their only GitHub-native
  # review surface too.
  repos:
    - apache/cassandra
    - apache/cassandra-dtest
    - apache/cassandra-java-driver
    - apache/cassandra-website
    - apache/cassandra-sidecar
    - apache/cassandra-analytics
    - apache/cassandra-accord

releases:
  type: git_tags_cross_checked_archive   # selects collectors/release.py
  # GA tags come from `repos[0]`'s own local clone -- GitHub Releases is
  # NOT used (verified live, DATA-SOURCES.md §3/§5: apache/cassandra
  # publishes 0 GitHub Releases; git tags are GitHub's only release
  # signal). archive.apache.org's directory listing below is an existence
  # cross-check only, never the date of record -- see
  # collectors/release.py's module docstring.
  archive_url: https://archive.apache.org/dist/cassandra/

# OpenSSF Scorecard + CVE/advisory collector (issue #55, D21 item 3). Both
# endpoints verified live and anonymous/unauthenticated, 2026-09-25.
security:
  type: openssf_scorecard_and_nvd    # selects collectors/security.py
  scorecard_url: https://api.securityscorecards.dev/projects/github.com/apache/cassandra
  nvd_cve_url: https://services.nvd.nist.gov/rest/json/cves/2.0
  # NVD's own CPE dictionary entry for this project (vendor=apache,
  # product=cassandra) -- verified live to return 16 CVEs, 2015-2026,
  # cleaner than a free-text keyword search (which also matched 9 unrelated
  # results mentioning "cassandra" in passing).
  cpe_match_string: "cpe:2.3:a:apache:cassandra:*:*:*:*:*:*:*:*"

# Releases tab (issue #166): per-branch CI state. JIRA versions/issues reuse
# `issue_tracker.base_url`/`.project_key` above -- no separate URL needed.
# Both endpoints verified live, anonymous/unauthenticated, 2026-10-12.
release_lines:
  type: jira_versions_butler_jenkins   # selects collectors/release_lines.py
  active_lines: ["6.0", "5.0", "4.1", "4.0", "3.11", "3.0"]  # + trunk (CI only, no JIRA line)
  butler_trends_url: https://butler.cassandra.apache.org/api/upstream/trends
  jenkins_api_url: https://ci-cassandra.apache.org/api/json

# affiliations_file/org_domains_file/org_aliases_file/github_company_lookback_months,
# bot_patterns, automated_senders, mailing_lists, and roster are PMC-wide --
# inherited from projects/_identity.yaml + projects/_shared.yaml via
# `extends:` above (issue #169).

reviewer_extraction:
  # Two independent sources, cross-checked against each other (ARCHITECTURE.md §3.1).
  # `jira_fields` is inherited from projects/_shared.yaml (ASF JIRA's custom-field
  # IDs are global to the whole JIRA instance, not Cassandra-specific) and deep-merged
  # with this project's own `commit_trailer`/`reliable_from` below (issue #169).
  commit_trailer:
    type: commit_message_regex
    # Cassandra's commit convention: "patch by X; reviewed by Y for CASSANDRA-NNNNN"
    pattern: '(?i)patch\s+by\s+(?P<patch_by>.+?)\s*;\s*reviewed\s+by\s+(?P<reviewed_by>.+?)\s+for\s+(?P<issue_key>CASSANDRA-\d+)'
    exclude_merge_commits: true    # required — merge commits carry no trailer of their own and
                                    # distort denominators (data-probe.md Corrections; ARCHITECTURE.md §3.1)
  reliable_from: "2017-01-01"      # coverage is patchier before this; see ARCHITECTURE.md §3.1, METRICS.md §0.4

# `truck_factor` metric (issue #53): file-authorship (Avelino DOA) collection excludes
# generated/vendored paths, which would otherwise inflate whoever ran a codegen/vendoring
# commit into looking like that file's "author" (METRICS.md `truck_factor` "Population &
# exclusions"). fnmatch-style globs against the repo-relative path; `*` matches across `/`.
# Placeholder set -- review against Cassandra's actual generated/vendored tree layout
# before relying on the metric (data-probe.md doesn't cover this; unverified against the
# real repo).
truck_factor:
  excluded_path_globs:
    - "*/generated-sources/*"
    - "*.g4"                       # ANTLR grammar sources are hand-authored; their
                                    # generated parser output is not checked in under this
                                    # repo's build, so this is here for defense-in-depth only
    - "*/antlr/*"

baseline_window:
  trailing_months: 24        # SCORING.md §4.1: status vs. own trailing 24-completed-month baseline
  min_completed_months: 12   # below this, dimension status renders "insufficient data" (SCORING.md §5.1)

slack:                       # phase 2b only; absent/null until PMC + Infra gates clear (D1)
  enabled: false
  workspace: null
  channels: []

# Governance compliance engine (issue #36, fixup cycle 1): per-run API budget
# for the two evidence collectors that hit external rate-limited services
# (collectors/jira_comments.py, collectors/github_checks.py). A nightly GitHub
# Actions run has a 60-minute timeout and its GITHUB_TOKEN a shared ~1,000
# req/hr allowance; these caps keep one governance run's share of that well
# inside both. `pipeline.py`'s `_collect_governance` stops cleanly (never a
# hard rate-limit error) once a cap is hit and records `status: "partial"` on
# the run manifest — a full backfill across historical issues/commits may
# take several nightly runs to catch up, by design.
governance:
  max_github_calls_per_run: 500
  max_jira_calls_per_run: 300

# Historical `issue_comment` backfill (issue #79): issue #54 added comment
# metadata to the ordinary incremental JIRA `/search` fetch, but production's
# JIRA watermark was already current when #54 shipped, so the ~21.5k
# pre-existing CASSANDRA issues have no comment rows and time_to_first_
# response_jira has no historical data. `pipeline._collect_jira_comment_
# backfill` fetches up to `max_issues_per_run` issues per run that have never
# had their comments checked, newest-created first, at the same JIRA
# politeness pacing (jira_comments.DEFAULT_MIN_REQUEST_INTERVAL, ~0.55s/call)
# governance's own CI-evidence backfill already uses -- ~1,000/run clears the
# backlog in roughly 2-3 weeks.
jira_comment_backfill:
  max_issues_per_run: 1000

# Patch-Available changelog backfill (issue #102, review-responsiveness
# metrics): a paged `project=CASSANDRA AND status WAS "Patch Available" AND
# key > <cursor> ORDER BY key ASC` search (`expand=changelog`), 100 issues
# per page (`collectors.jira.BACKFILL_PAGE_SIZE`), for the ~11,754
# pre-existing Patch-Available issues the ordinary incremental fetch's
# watermark will never revisit. `max_pages_per_run` pages/night -> at the
# default, `ceil(11754 / 100 / 40) = 3` nights to reach full coverage.
jira_patch_available_backfill:
  max_pages_per_run: 40

# `pr_issue_link` historical backfill (issue #105, review-responsiveness
# metrics): a paged `repository.pullRequests(first:100, orderBy: CREATED_AT
# ASC){ number title }` GraphQL walk of each `pull_requests.repos` repo (100
# PRs/page, `collectors.github.PR_ISSUE_LINK_BACKFILL_PAGE_SIZE`), for every
# PR collected before `pr.linked_issue_keys` (issue #102) existed --
# apache/cassandra alone is ~53 pages. `max_pages_per_run` pages/night ->
# at the default, `ceil(53 / 20) = 3` nights to reach full coverage of
# apache/cassandra alone (other configured repos add more, spent from the
# same shared per-run budget). Shares apache/cassandra's GraphQL rate-limit
# budget with the ordinary incremental `github` collector in the same
# nightly run (`GitHubCollector.rate_limit_floor`).
pr_issue_link_backfill:
  max_pages_per_run: 20
