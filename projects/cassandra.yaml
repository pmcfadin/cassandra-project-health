# Cassandra project configuration — placeholder
# Schema defined in docs/spec/ARCHITECTURE.md §2.1. Values below follow that schema's shape;
# treat this file as a starting point to review before the collectors are built, not final config.

project:
  id: cassandra
  display_name: Apache Cassandra
  homepage: https://cassandra.apache.org

# One or more repos; the git adapter clones/fetches each. cassandra-website is illustrative —
# confirm whether it should be in scope before enabling it.
repos:
  - owner: apache
    name: cassandra
    default_branch: trunk
  # - owner: apache
  #   name: cassandra-website
  #   default_branch: main

issue_tracker:
  type: jira                       # selects core/adapters/jira.py
  base_url: https://issues.apache.org/jira
  project_key: CASSANDRA

pull_requests:
  type: github                     # selects core/adapters/github.py; GitHub PRs cover only
  # part of review activity per DECISIONS.md — JIRA is primary for Cassandra.
  # Related repos confirmed to exist (DATA-SOURCES.md §3, verified 2026-09-25); all have
  # GitHub Issues/Discussions disabled like the main repo, so PRs are their only GitHub-native
  # review surface too.
  repos:
    - apache/cassandra
    - apache/cassandra-dtest
    - apache/cassandra-java-driver
    - apache/cassandra-website
    - apache/cassandra-sidecar
    - apache/cassandra-analytics
    - apache/cassandra-accord

mailing_lists:
  type: ponymail                   # selects collectors/ponymail.py
  domain: cassandra.apache.org
  lists: [dev, user]               # not commits@ — auto-generated commit-notification traffic, not discussion (issue #33)
  metadata_only: true              # Phase 1 (D1): sender, timestamp, thread structure — no body
  max_months_per_run: 36           # nightly time budget (issue #33 fixup): ~5 min/list at the ≤2 req/s pacing
                                    # cap; backfills oldest-first across runs until each list is caught up

roster:
  type: asf_whimsy                 # selects core/adapters/asf_roster.py
  committee_info_url: https://whimsy.apache.org/public/committee-info.json
  public_ldap_projects_url: https://whimsy.apache.org/public/public_ldap_projects.json
  podling: false

releases:
  type: github_releases
  repos: [apache/cassandra]

affiliations_file: affiliations.yaml   # D6: curated, PR-reviewed, dated ranges

# Applied by identity resolution before any metric counts a contributor.
# Placeholder set — data-probe.md found zero bot commits in git history for this repo,
# so this list matters more for GitHub/JIRA identities; review before enabling.
bot_patterns:
  - field: git_author_email
    regex: '(?i)noreply@github\.com$|\[bot\]'
  - field: github_login
    regex: '(?i)-bot$|^dependabot'
  - field: jira_username
    regex: '(?i)^svn-role$|^git-role$'   # ASF infra service accounts

reviewer_extraction:
  # Two independent sources, cross-checked against each other (ARCHITECTURE.md §3.1).
  commit_trailer:
    type: commit_message_regex
    # Cassandra's commit convention: "patch by X; reviewed by Y for CASSANDRA-NNNNN"
    pattern: '(?i)patch\s+by\s+(?P<patch_by>.+?)\s*;\s*reviewed\s+by\s+(?P<reviewed_by>.+?)\s+for\s+(?P<issue_key>CASSANDRA-\d+)'
    exclude_merge_commits: true    # required — merge commits carry no trailer of their own and
                                    # distort denominators (data-probe.md Corrections; ARCHITECTURE.md §3.1)
  jira_fields:
    type: jira_custom_field
    reviewers_field: customfield_12313420   # "Reviewers", multi-user (11,125 CASSANDRA issues populated)
    reviewer_field: customfield_10022        # "Reviewer", single-user, older/legacy (7,104 issues populated)
  reliable_from: "2017-01-01"      # coverage is patchier before this; see ARCHITECTURE.md §3.1, METRICS.md §0.4

# `truck_factor` metric (issue #53): file-authorship (Avelino DOA) collection excludes
# generated/vendored paths, which would otherwise inflate whoever ran a codegen/vendoring
# commit into looking like that file's "author" (METRICS.md `truck_factor` "Population &
# exclusions"). fnmatch-style globs against the repo-relative path; `*` matches across `/`.
# Placeholder set -- review against Cassandra's actual generated/vendored tree layout
# before relying on the metric (data-probe.md doesn't cover this; unverified against the
# real repo).
truck_factor:
  excluded_path_globs:
    - "*/generated-sources/*"
    - "*.g4"                       # ANTLR grammar sources are hand-authored; their
                                    # generated parser output is not checked in under this
                                    # repo's build, so this is here for defense-in-depth only
    - "*/antlr/*"

baseline_window:
  trailing_months: 24        # SCORING.md §4.1: status vs. own trailing 24-completed-month baseline
  min_completed_months: 12   # below this, dimension status renders "insufficient data" (SCORING.md §5.1)

slack:                       # phase 2b only; absent/null until PMC + Infra gates clear (D1)
  enabled: false
  workspace: null
  channels: []

# Governance compliance engine (issue #36, fixup cycle 1): per-run API budget
# for the two evidence collectors that hit external rate-limited services
# (collectors/jira_comments.py, collectors/github_checks.py). A nightly GitHub
# Actions run has a 60-minute timeout and its GITHUB_TOKEN a shared ~1,000
# req/hr allowance; these caps keep one governance run's share of that well
# inside both. `pipeline.py`'s `_collect_governance` stops cleanly (never a
# hard rate-limit error) once a cap is hit and records `status: "partial"` on
# the run manifest — a full backfill across historical issues/commits may
# take several nightly runs to catch up, by design.
governance:
  max_github_calls_per_run: 500
  max_jira_calls_per_run: 300
