# Cassandra project configuration — placeholder
# Schema defined in docs/spec/ARCHITECTURE.md §2.1. Values below follow that schema's shape;
# treat this file as a starting point to review before the collectors are built, not final config.

project:
  id: cassandra
  display_name: Apache Cassandra
  homepage: https://cassandra.apache.org

# One or more repos; the git adapter clones/fetches each. cassandra-website is illustrative —
# confirm whether it should be in scope before enabling it.
repos:
  - owner: apache
    name: cassandra
    default_branch: trunk
  # - owner: apache
  #   name: cassandra-website
  #   default_branch: main

issue_tracker:
  type: jira                       # selects core/adapters/jira.py
  base_url: https://issues.apache.org/jira
  project_key: CASSANDRA

pull_requests:
  type: github                     # selects core/adapters/github.py; GitHub PRs cover only
  # part of review activity per DECISIONS.md — JIRA is primary for Cassandra.
  # Related repos confirmed to exist (DATA-SOURCES.md §3, verified 2026-09-25); all have
  # GitHub Issues/Discussions disabled like the main repo, so PRs are their only GitHub-native
  # review surface too.
  repos:
    - apache/cassandra
    - apache/cassandra-dtest
    - apache/cassandra-java-driver
    - apache/cassandra-website
    - apache/cassandra-sidecar
    - apache/cassandra-analytics
    - apache/cassandra-accord

mailing_lists:
  type: ponymail                   # selects collectors/ponymail.py
  domain: cassandra.apache.org
  lists: [dev, user]               # not commits@ — auto-generated commit-notification traffic, not discussion (issue #33)
  metadata_only: true              # Phase 1 (D1): sender, timestamp, thread structure — no body
  max_months_per_run: 36           # nightly time budget (issue #33 fixup): ~5 min/list at the ≤2 req/s pacing
                                    # cap; backfills oldest-first across runs until each list is caught up
  # issue #35: reviewed list of automated dev@ senders, verified against a full
  # live dev@ collection (2009-01-28 through 2026-09-25, 30,625 messages,
  # 1,561 distinct senders). Matched against the lowercased From: address
  # (`sender_raw_value`) with Python `re.search`.
  # `time_to_first_reply_devlist`/`unanswered_thread_rate_devlist` (METRICS.md
  # §4) exclude any reply from one of these addresses, and drop a whole thread
  # from either metric's population when the *root* message's sender matches.
  #
  # Top automated senders actually found on dev@ (message counts from the
  # live pull above) -- every entry below is backed by one of these:
  #   2034  jenkins@builds.apache.org   (Apache Jenkins Server -- CI)
  #    574  hudson@hudson.apache.org    (Apache Hudson Server -- CI)
  #    208  git@git.apache.org          (ASF git commit-notification bridge;
  #                                       display name is the committer's
  #                                       username, but the message itself is
  #                                       generated by the git post-receive
  #                                       hook, never typed by a human)
  #    100  hudson@hudson.zones.apache.org (Apache Hudson Server -- CI, legacy host)
  #      1  no-reply@apache.org         (ASF infra bounce/notification)
  #
  # Explicitly NOT included, despite looking automated at first glance:
  # `dev@cassandra.apache.org` itself appears as `sender_raw_value` on 401
  # messages, but its `sender_display_name` is a distinct real human each
  # time (e.g. "Claude Warren, Jr via dev", "German Eichberger via dev") --
  # this is DMARC-driven From:-rewriting by the list software for senders
  # whose own domain enforces strict DMARC, not automation. Treating it as
  # automated would wrongly drop real replies/threads from dozens of
  # distinct people.
  #
  # No JIRA-to-list bridge or GitHub-notification sender was found at all in
  # this pull (`git.apache.org` handles the git-commit bridge instead) --
  # METRICS.md's "if such a list is in scope" caveat currently doesn't apply
  # to apache/cassandra's dev@, so no pattern is added speculatively for it;
  # revisit if that changes.
  automated_senders:
    - '(?i)^jenkins@builds\.apache\.org$'
    - '(?i)^hudson@hudson\.apache\.org$'
    - '(?i)^hudson@hudson\.zones\.apache\.org$'
    - '(?i)^git@git\.apache\.org$'
    - '(?i)^no-reply@apache\.org$'

roster:
  type: asf_whimsy                 # selects core/adapters/asf_roster.py
  committee_info_url: https://whimsy.apache.org/public/committee-info.json
  public_ldap_projects_url: https://whimsy.apache.org/public/public_ldap_projects.json
  podling: false

releases:
  type: github_releases
  repos: [apache/cassandra]

# OpenSSF Scorecard + CVE/advisory collector (issue #55, D21 item 3). Both
# endpoints verified live and anonymous/unauthenticated, 2026-09-25.
security:
  type: openssf_scorecard_and_nvd    # selects collectors/security.py
  scorecard_url: https://api.securityscorecards.dev/projects/github.com/apache/cassandra
  nvd_cve_url: https://services.nvd.nist.gov/rest/json/cves/2.0
  # NVD's own CPE dictionary entry for this project (vendor=apache,
  # product=cassandra) -- verified live to return 16 CVEs, 2015-2026,
  # cleaner than a free-text keyword search (which also matched 9 unrelated
  # results mentioning "cassandra" in passing).
  cpe_match_string: "cpe:2.3:a:apache:cassandra:*:*:*:*:*:*:*:*"

affiliations_file: affiliations.yaml   # D6: curated, PR-reviewed, dated ranges
org_domains_file: org_domains.yaml     # D6: reviewed email-domain -> organization map (issue #52)
org_aliases_file: org_aliases.yaml     # D6: reviewed GitHub company-field alias map (issue #52 fixup 1)
# D6, issue #52 fixup cycle 2: a GitHub profile's `company` field is a
# current-employer signal, not a historical one -- bound each github_company
# affiliation_period row to the trailing N months before that profile was
# fetched (normalize/affiliation.py's DEFAULT_GITHUB_COMPANY_LOOKBACK_MONTHS).
github_company_lookback_months: 24

# Applied by identity resolution before any metric counts a contributor.
# Placeholder set — data-probe.md found zero bot commits in git history for this repo,
# so this list matters more for GitHub/JIRA identities; review before enabling.
bot_patterns:
  - field: git_author_email
    regex: '(?i)noreply@github\.com$|\[bot\]'
  - field: github_login
    regex: '(?i)-bot$|^dependabot'
  - field: jira_username
    regex: '(?i)^svn-role$|^git-role$'   # ASF infra service accounts

# Phase 2a text pipeline (issue #43, D18): automated senders whose messages are
# dropped before fetch/preprocess -- never fetched for classification at all,
# since they are not human communication (COMMUNITY-HEALTH.md §4.1). Matched
# case-insensitively against a message's raw sender: the mailing-list `From:`
# address for dev@/user@, or the JIRA comment author's username. This is a
# distinct config key from `bot_patterns` above (which excludes bot *identities*
# from Phase 1 contributor-activity metrics, keyed by git/GitHub/JIRA identity
# fields, not message sender strings) -- kept separate so identity resolution
# and text-pipeline filtering can each evolve independently.
# Shared with issue #35's dev@ automated-sender work: append new patterns here
# rather than starting a second list, so both issues filter from one place.
# Placeholder set, unreviewed -- confirm against real dev@ `From:` addresses
# and JIRA comment authors (commits@-style bots, ASF Infra JIRA/GitHub
# integration accounts, CI bots) before Phase 2a fetches real messages at scale.
automated_senders:
  - regex: '(?i)^jira@|@jira\.apache\.org$'
    note: "ASF JIRA's own notification/integration address"
  - regex: '(?i)^git@|^commits?@'
    note: "commit-notification mail, not discussion (issue #33 excludes commits@ from mailing_lists.lists for the same reason)"
  - regex: '(?i)noreply@github\.com$|^notifications@github\.com$'
    note: "GitHub notification mail"
  - regex: '(?i)\[bot\]|-bot$|^dependabot'
    note: "GitHub App / dependabot-style bot accounts, mirrors bot_patterns.github_login"
  - regex: '(?i)^hudson@|^jenkins@|^ci@|^builds?@'
    note: "CI system notification senders"
  - regex: '(?i)^svn-role$|^git-role$'
    note: "ASF infra service accounts (JIRA username form), mirrors bot_patterns.jira_username"

reviewer_extraction:
  # Two independent sources, cross-checked against each other (ARCHITECTURE.md §3.1).
  commit_trailer:
    type: commit_message_regex
    # Cassandra's commit convention: "patch by X; reviewed by Y for CASSANDRA-NNNNN"
    pattern: '(?i)patch\s+by\s+(?P<patch_by>.+?)\s*;\s*reviewed\s+by\s+(?P<reviewed_by>.+?)\s+for\s+(?P<issue_key>CASSANDRA-\d+)'
    exclude_merge_commits: true    # required — merge commits carry no trailer of their own and
                                    # distort denominators (data-probe.md Corrections; ARCHITECTURE.md §3.1)
  jira_fields:
    type: jira_custom_field
    reviewers_field: customfield_12313420   # "Reviewers", multi-user (11,125 CASSANDRA issues populated)
    reviewer_field: customfield_10022        # "Reviewer", single-user, older/legacy (7,104 issues populated)
  reliable_from: "2017-01-01"      # coverage is patchier before this; see ARCHITECTURE.md §3.1, METRICS.md §0.4

# `truck_factor` metric (issue #53): file-authorship (Avelino DOA) collection excludes
# generated/vendored paths, which would otherwise inflate whoever ran a codegen/vendoring
# commit into looking like that file's "author" (METRICS.md `truck_factor` "Population &
# exclusions"). fnmatch-style globs against the repo-relative path; `*` matches across `/`.
# Placeholder set -- review against Cassandra's actual generated/vendored tree layout
# before relying on the metric (data-probe.md doesn't cover this; unverified against the
# real repo).
truck_factor:
  excluded_path_globs:
    - "*/generated-sources/*"
    - "*.g4"                       # ANTLR grammar sources are hand-authored; their
                                    # generated parser output is not checked in under this
                                    # repo's build, so this is here for defense-in-depth only
    - "*/antlr/*"

baseline_window:
  trailing_months: 24        # SCORING.md §4.1: status vs. own trailing 24-completed-month baseline
  min_completed_months: 12   # below this, dimension status renders "insufficient data" (SCORING.md §5.1)

slack:                       # phase 2b only; absent/null until PMC + Infra gates clear (D1)
  enabled: false
  workspace: null
  channels: []

# Governance compliance engine (issue #36, fixup cycle 1): per-run API budget
# for the two evidence collectors that hit external rate-limited services
# (collectors/jira_comments.py, collectors/github_checks.py). A nightly GitHub
# Actions run has a 60-minute timeout and its GITHUB_TOKEN a shared ~1,000
# req/hr allowance; these caps keep one governance run's share of that well
# inside both. `pipeline.py`'s `_collect_governance` stops cleanly (never a
# hard rate-limit error) once a cap is hit and records `status: "partial"` on
# the run manifest — a full backfill across historical issues/commits may
# take several nightly runs to catch up, by design.
governance:
  max_github_calls_per_run: 500
  max_jira_calls_per_run: 300
