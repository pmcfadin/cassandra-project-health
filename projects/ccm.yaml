# Cassandra Cluster Manager (ccm) — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# ccm has no JIRA project of its own; its issues are filed in CASSANDRA with
# `component = "Tool/CCM"`, hence `issue_tracker.jql_filter` below rather
# than a distinct `project_key`. It ALSO has GitHub Issues enabled
# (verified live), hence both `issue_tracker` and `github_issues` below --
# same dual-tracker shape as gocql-driver.yaml.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-ccm,
# .../tags?per_page=30): default_branch=trunk; the only tag present is
# `cassandra-test` -- not a version tag at all, so no systematic release-tag
# scheme, hence `releases.tag_prefix: ""`. `has_issues: true`.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: ccm
  display_name: Cassandra Cluster Manager (ccm)

repos:
  - owner: apache
    name: cassandra-ccm
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSANDRA
  jql_filter: 'component = "Tool/CCM"'

github_issues:
  repos: [apache/cassandra-ccm]   # verified live: has_issues=true

pull_requests:
  type: github
  repos: [apache/cassandra-ccm]

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: ""        # verified live: only tag present (`cassandra-test`) isn't a version tag
  # Verified live 2026-10-12: https://archive.apache.org/dist/cassandra/cassandra-ccm/ and
  # https://archive.apache.org/dist/cassandra/ccm/ both return HTTP 404 -- no
  # archive.apache.org/dist distribution for this repo.
  archive_url: null

shared_sources: [asf_roster, ponymail, governance]
