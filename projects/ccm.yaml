# Cassandra Cluster Manager (ccm) — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# ccm has no JIRA project of its own; its issues are filed in CASSANDRA with
# `component = "Tool/CCM"`, hence `issue_tracker.jql_filter` below rather
# than a distinct `project_key`. It ALSO has GitHub Issues enabled
# (verified live), hence both `issue_tracker` and `github_issues` below --
# same dual-tracker shape as gocql-driver.yaml.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-ccm,
# .../tags?per_page=30): default_branch=trunk; the only tag present is
# `cassandra-test` -- not a version tag at all, so there are zero GA
# releases. No `releases:` section below (issue #181): with no systematic
# release-tag scheme, release cadence is not a thing this project has, not
# a thing it has zero data for -- omitting the section makes
# `pipeline.applicable_sources` treat `release` as not_applicable
# (metrics_not_applicable), rather than collecting a real-but-always-empty
# `release` table that degrades the run every time (release_frequency/
# release_regularity/time_since_last_release/days_between_releases all emit
# zero rows with zero GA dates -- see `metrics/release_cadence.py`).
# `has_issues: true`.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: ccm
  display_name: Cassandra Cluster Manager (ccm)

repos:
  - owner: apache
    name: cassandra-ccm
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSANDRA
  jql_filter: 'component = "Tool/CCM"'

github_issues:
  repos: [apache/cassandra-ccm]   # verified live: has_issues=true

pull_requests:
  type: github
  repos: [apache/cassandra-ccm]

# No `releases:` section -- see the module-top comment (issue #181): ccm's
# only tag (`cassandra-test`) isn't a GA release, so release cadence is
# not_applicable here, not a degraded/missing metric. (Also verified live
# 2026-10-12: https://archive.apache.org/dist/cassandra/cassandra-ccm/ and
# https://archive.apache.org/dist/cassandra/ccm/ both 404 -- no
# archive.apache.org/dist distribution either.)

# `releases_tab:` (issue #175): CASSANDRA fixVersions scoped by this
# project's own `issue_tracker.jql_filter` (`component = "Tool/CCM"`)
# above, plus GitHub Actions CI. Live-verified 2026-10-12: this repo's
# default branch (`trunk`) has real, repo-committed workflows ("CI - Python
# 3.x", "CI - Python 2.7") with recent, regularly-succeeding runs -- the
# site shows each one's latest conclusion.
releases_tab:
  type: jira_versions_github_actions

shared_sources: [asf_roster, ponymail, governance]
