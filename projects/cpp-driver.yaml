# Apache Cassandra C/C++ Driver — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-cpp-driver,
# .../tags?per_page=30): default_branch=trunk, newest tags 2.17.1/2.17.0/...
# -- NO prefix before the version number.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: cpp-driver
  display_name: Apache Cassandra C/C++ Driver

repos:
  - owner: apache
    name: cassandra-cpp-driver
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSCPP

pull_requests:
  type: github
  repos: [apache/cassandra-cpp-driver]

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: ""        # verified live: tags are bare `2.17.1`, no prefix
  # Verified live 2026-10-12: https://archive.apache.org/dist/cassandra/cassandra-cpp-driver/
  # returns HTTP 404 -- unlike java/gocql/python/nodejs-driver, sidecar, and analytics, this
  # repo has no archive.apache.org/dist distribution at all.
  archive_url: null

# `releases_tab:` (issue #175): unreleased CASSCPP fixVersions with ticket
# counts + GitHub Actions CI. Live-verified 2026-10-12: this repo's default
# branch (`trunk`) has NO real, repo-committed workflow run on it (only a
# Copilot-review pseudo-workflow) -- the site renders "not tracked" for CI,
# a verified fact, not a guess.
releases_tab:
  type: jira_versions_github_actions

shared_sources: [asf_roster, ponymail, governance]
