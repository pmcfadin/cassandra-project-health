# Apache Cassandra easy-stress — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# easy-stress has no JIRA project -- no `issue_tracker` section; it tracks
# issues on GitHub only, hence `github_issues` as its sole tracker.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-easy-stress,
# .../tags?per_page=30): default_branch=main, newest tags v9/v8/v7/... --
# `v` prefix, and GA tags are bare MAJOR versions (no minor/patch), hence
# `releases.ga_major_only: true`. `has_issues: true`.

project:
  id: easy-stress
  display_name: Apache Cassandra easy-stress

repos:
  - owner: apache
    name: cassandra-easy-stress
    default_branch: main

github_issues:
  repos: [apache/cassandra-easy-stress]   # verified live: has_issues=true; no JIRA project

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: "v"        # verified live: tags are `v9`, `v8`, `v7`, ...
  ga_major_only: true    # verified live: GA tags are bare major versions, e.g. `v9`
  archive_url: null      # no archive.apache.org/dist distribution for this repo

shared_sources: [asf_roster, ponymail, governance]
