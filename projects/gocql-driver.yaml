# Apache Cassandra Go Driver (gocql) — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-gocql-driver,
# .../tags?per_page=30): default_branch=trunk, newest tags v2.1.2/v2.1.1/...
# -- `v` prefix. `has_issues: true` -- GitHub Issues is enabled on this repo
# ALONGSIDE its JIRA tracker, hence both `issue_tracker` and `github_issues`
# below.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: gocql-driver
  display_name: Apache Cassandra Go Driver (gocql)

repos:
  - owner: apache
    name: cassandra-gocql-driver
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSGO

github_issues:
  repos: [apache/cassandra-gocql-driver]   # verified live: has_issues=true

pull_requests:
  type: github
  repos: [apache/cassandra-gocql-driver]

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: "v"        # verified live: tags are `v2.1.2`
  # Verified live 2026-10-12: archive.apache.org/dist/cassandra/cassandra-gocql-driver/
  # exists and lists bare-version directories (e.g. `1.7.0/`, mtime 2026-05-01) in the
  # same autoindex format collectors/release.py's `_parse_archive_listing` already parses.
  archive_url: https://archive.apache.org/dist/cassandra/cassandra-gocql-driver/

# `releases_tab:` (issue #175): unreleased CASSGO fixVersions with ticket
# counts + GitHub Actions CI. Live-verified 2026-10-12: this repo's
# default branch (`trunk`) has a real, repo-committed workflow ("Build",
# `.github/workflows/main.yml`) with recent runs -- the site shows its
# latest conclusion.
releases_tab:
  type: jira_versions_github_actions

shared_sources: [asf_roster, ponymail, governance]
