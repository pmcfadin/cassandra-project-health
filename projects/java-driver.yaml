# Apache Cassandra Java Driver — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline;
# this file exists so `load_project` + `list-projects` can be exercised
# against a real subproject before the rest of the epic turns it on.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-java-driver,
# .../tags?per_page=30): default_branch=trunk, newest tags 4.19.4/4.19.3/...
# -- NO prefix before the version number (unlike Cassandra's own
# `cassandra-5.0.0`), hence `releases.tag_prefix: ""` below.
#
# Identity/bot settings (bot_patterns, affiliation/org files) are PMC-wide
# -- inherited from projects/_identity.yaml via `extends:` (issue #169
# fixup round 1) so dependabot/CI-bot activity doesn't leak into this
# project's own contributor metrics.
extends: _identity.yaml

project:
  id: java-driver
  display_name: Apache Cassandra Java Driver

repos:
  - owner: apache
    name: cassandra-java-driver
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSJAVA

pull_requests:
  type: github
  repos: [apache/cassandra-java-driver]

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: ""        # verified live: tags are bare `4.19.4`, no prefix
  # Verified live 2026-10-12: archive.apache.org/dist/cassandra/cassandra-java-driver/
  # exists and lists bare-version directories (e.g. `4.19.3/`, mtime 2026-06-01) in the
  # same autoindex format collectors/release.py's `_parse_archive_listing` already parses.
  archive_url: https://archive.apache.org/dist/cassandra/cassandra-java-driver/
  # issue #170 PR #179 review fixup: this repo's tag history has four bogus
  # bare `major.minor` tags -- `1.0`, `2.0`, `2.1`, `2.2` -- all created
  # within two minutes of each other on 2023-11-28 (donation-time
  # branch-archive tags, verified live via `git for-each-ref`), not real
  # GA releases (the real `1.0.0`/`2.0.0` are tagged 2013/2014
  # respectively, and `2.2` never shipped a GA release at all -- it went
  # straight from `2.1.x` to `3.0.x`). `ga_require_patch: true` requires a
  # tag's suffix to carry a `.patch` component, excluding all four without
  # excluding any real release (every real line here has at least one
  # `major.minor.patch` tag).
  ga_require_patch: true

# `releases_tab:` (issue #175) -- this project's own, simpler Releases tab
# (unreleased CASSJAVA fixVersions with ticket counts + GitHub Actions CI;
# selects collectors/subproject_releases.py, see config.ProjectConfig.
# releases_tab's own docstring for why this is a separate section from
# Cassandra's own `release_lines:`). Live-verified 2026-10-12: every
# unreleased CASSJAVA version's `description` is null (no blocker-ladder
# scheme here); this repo's default branch (`trunk`) has NO real,
# repo-committed GitHub Actions workflow run on it (only GitHub's own
# Copilot-review pseudo-workflow) -- the site renders "not tracked" for
# CI, a verified fact, not a guess.
releases_tab:
  type: jira_versions_github_actions

# PMC-wide sources (dev@/user@, roster, governance) are shown as a shared
# notice on this project's site tabs rather than independently collected
# (epic #168) -- see projects/_shared.yaml.
shared_sources: [asf_roster, ponymail, governance]
