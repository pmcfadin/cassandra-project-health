# Apache Cassandra Node.js Driver — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-nodejs-driver,
# .../tags?per_page=30): default_branch=trunk, newest tags v4.10.0/v4.9.0/...
# -- `v` prefix.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: nodejs-driver
  display_name: Apache Cassandra Node.js Driver

repos:
  - owner: apache
    name: cassandra-nodejs-driver
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSNODEJS

pull_requests:
  type: github
  repos: [apache/cassandra-nodejs-driver]

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: "v"        # verified live: tags are `v4.10.0`
  # Verified live 2026-10-12: archive.apache.org/dist/cassandra/cassandra-nodejs-driver/
  # exists and lists bare-version directories (e.g. `4.10.0/`, mtime 2026-09-23) in the
  # same autoindex format collectors/release.py's `_parse_archive_listing` already parses.
  archive_url: https://archive.apache.org/dist/cassandra/cassandra-nodejs-driver/

shared_sources: [asf_roster, ponymail, governance]
