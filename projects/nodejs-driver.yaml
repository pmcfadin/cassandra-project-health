# Apache Cassandra Node.js Driver — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-nodejs-driver,
# .../tags?per_page=30): default_branch=trunk, newest tags v4.10.0/v4.9.0/...
# -- `v` prefix.

project:
  id: nodejs-driver
  display_name: Apache Cassandra Node.js Driver

repos:
  - owner: apache
    name: cassandra-nodejs-driver
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSNODEJS

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: "v"        # verified live: tags are `v4.10.0`
  archive_url: null      # no archive.apache.org/dist distribution for this repo

shared_sources: [asf_roster, ponymail, governance]
