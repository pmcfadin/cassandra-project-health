# Apache Cassandra Python Driver — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-python-driver,
# .../tags?per_page=30): default_branch=trunk, newest tags 3.30.1/3.30.0/...
# -- NO prefix before the version number.

project:
  id: python-driver
  display_name: Apache Cassandra Python Driver

repos:
  - owner: apache
    name: cassandra-python-driver
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSPYTHON

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: ""        # verified live: tags are bare `3.30.1`, no prefix
  archive_url: null     # no archive.apache.org/dist distribution for this repo

shared_sources: [asf_roster, ponymail, governance]
