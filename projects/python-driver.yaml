# Apache Cassandra Python Driver — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-python-driver,
# .../tags?per_page=30): default_branch=trunk, newest tags 3.30.1/3.30.0/...
# -- NO prefix before the version number.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: python-driver
  display_name: Apache Cassandra Python Driver

repos:
  - owner: apache
    name: cassandra-python-driver
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSPYTHON

pull_requests:
  type: github
  repos: [apache/cassandra-python-driver]

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: ""        # verified live: tags are bare `3.30.1`, no prefix
  # Verified live 2026-10-12: archive.apache.org/dist/cassandra/cassandra-python-driver/
  # exists and lists bare-version directories (e.g. `3.30.1/`, mtime 2026-07-06) in the
  # same autoindex format collectors/release.py's `_parse_archive_listing` already parses.
  archive_url: https://archive.apache.org/dist/cassandra/cassandra-python-driver/

# `releases_tab:` (issue #175): unreleased CASSPYTHON fixVersions with
# ticket counts + GitHub Actions CI. Live-verified 2026-10-12: this repo's
# default branch (`trunk`) has NO real, repo-committed workflow run on it
# (only Copilot-review/Dependabot/pages-build-deployment pseudo-workflows)
# -- the site renders "not tracked" for CI, a verified fact, not a guess.
releases_tab:
  type: jira_versions_github_actions

shared_sources: [asf_roster, ponymail, governance]
