# Apache Cassandra Sidecar — placeholder config (issue #169, epic #168).
# `enabled: false` in projects/index.yaml -- not yet wired into site/pipeline.
#
# Live-verified 2026-10-12 (gh api repos/apache/cassandra-sidecar,
# .../tags?per_page=30): default_branch=trunk, newest tags
# cassandra-sidecar-0.4.0/0.3.0/... -- `cassandra-sidecar-` prefix.
#
# Identity/bot settings are PMC-wide -- inherited from projects/_identity.yaml
# via `extends:` (issue #169 fixup round 1).
extends: _identity.yaml

project:
  id: sidecar
  display_name: Apache Cassandra Sidecar

repos:
  - owner: apache
    name: cassandra-sidecar
    default_branch: trunk

issue_tracker:
  type: jira
  base_url: https://issues.apache.org/jira
  project_key: CASSSIDECAR

pull_requests:
  type: github
  repos: [apache/cassandra-sidecar]

releases:
  type: git_tags_cross_checked_archive
  tag_prefix: "cassandra-sidecar-"   # verified live: tags are `cassandra-sidecar-0.4.0`
  # Verified live 2026-10-12: archive.apache.org/dist/cassandra/cassandra-sidecar/ exists
  # and lists bare-version directories (e.g. `0.1.0/`, mtime 2025-03-06 -- note: bare
  # version, NOT the `cassandra-sidecar-` git-tag prefix) in the same autoindex format
  # collectors/release.py's `_parse_archive_listing` already parses.
  archive_url: https://archive.apache.org/dist/cassandra/cassandra-sidecar/

shared_sources: [asf_roster, ponymail, governance]
