[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-health"
version = "0.0.1"
description = "Automated health reporting for open-source projects"
readme = "README.md"
license = {text = "Apache License 2.0"}
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "typesafe-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
project-health = "project_health.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"project_health.site" = ["templates/*.html", "static/*"]
"project_health.label" = ["static/*", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
